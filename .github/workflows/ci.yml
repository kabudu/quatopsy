name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0 action
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Bootstrap locked dependencies
        run: |
          cargo fetch --locked
          npm --prefix website ci --ignore-scripts
      - name: Authoritative quality gate
        run: ./scripts/ci-local.sh
      - name: Validate all Cargo publication payloads
        run: ./scripts/publish-crates.sh --dry-run
