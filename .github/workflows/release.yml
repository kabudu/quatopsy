name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish Cargo workspace and GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0 action
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Bind tag, master, Cargo, and changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          python3 scripts/release.py check --expect-version "$version" --release
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Authoritative quality gate
        run: ./scripts/ci-local.sh
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          QUATOPSY_RELEASE_AUTHORIZE: "1"
        run: ./scripts/publish-crates.sh --publish
      - name: Render GitHub release notes from CHANGELOG.md
        run: python3 scripts/release.py notes "$VERSION" > /tmp/quatopsy-release-notes.md
      - name: Publish or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Quatopsy v$VERSION" \
              --notes-file /tmp/quatopsy-release-notes.md \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Quatopsy v$VERSION" \
              --notes-file /tmp/quatopsy-release-notes.md \
              --latest
          fi
