[workspace]
resolver = "3"
members = [
    "crates/quatopsy-schema",
    "crates/quatopsy-core",
    "crates/quatopsy-oracle",
    "crates/quatopsy-adapt",
    "crates/quatopsy-plan",
    "crates/quatopsy-nav",
    "crates/quatopsy-guidance",
    "crates/quatopsy-control",
    "crates/quatopsy-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/kabudu/quatopsy"
readme = "CRATE_README.md"
keywords = ["quaternion", "attitude", "spacecraft", "robotics", "simulation"]
categories = ["aerospace", "command-line-utilities", "mathematics", "science"]
publish = true

[workspace.dependencies]
clap = { version = "4.5.51", features = ["derive"] }
ctrlc = "3.5.0"
csv = "1.4.0"
libm = "0.2.15"
quatopsy-adapt = { version = "=0.2.0", path = "crates/quatopsy-adapt" }
quatopsy-core = { version = "=0.2.0", path = "crates/quatopsy-core" }
quatopsy-oracle = { version = "=0.2.0", path = "crates/quatopsy-oracle" }
quatopsy-plan = { version = "=0.2.0", path = "crates/quatopsy-plan" }
quatopsy-nav = { version = "=0.2.0", path = "crates/quatopsy-nav" }
quatopsy-guidance = { version = "=0.2.0", path = "crates/quatopsy-guidance" }
quatopsy-control = { version = "=0.2.0", path = "crates/quatopsy-control" }
quatopsy-schema = { version = "=0.2.0", path = "crates/quatopsy-schema" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
