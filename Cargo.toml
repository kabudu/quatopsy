[workspace]
resolver = "3"
members = [
    "crates/quatopsy-schema",
    "crates/quatopsy-core",
    "crates/quatopsy-oracle",
    "crates/quatopsy-adapt",
    "crates/quatopsy-plan",
    "crates/quatopsy-control",
    "crates/quatopsy-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/kabudu/quatopsy"
publish = false

[workspace.dependencies]
clap = { version = "4.5.51", features = ["derive"] }
ctrlc = "3.5.0"
csv = "1.4.0"
libm = "0.2.15"
quatopsy-adapt = { path = "crates/quatopsy-adapt" }
quatopsy-core = { path = "crates/quatopsy-core" }
quatopsy-oracle = { path = "crates/quatopsy-oracle" }
quatopsy-plan = { path = "crates/quatopsy-plan" }
quatopsy-control = { path = "crates/quatopsy-control" }
quatopsy-schema = { path = "crates/quatopsy-schema" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
